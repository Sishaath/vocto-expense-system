name: Deploy Notification

on:
  push:
    branches: [main]

jobs:
  notify:
    name: Notify on Production Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed files
        id: changes
        run: |
          echo "files=$(git diff --name-status HEAD~1 HEAD | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Send deploy notification via Resend
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "Vocto Expense <onboarding@resend.dev>",
              "to": "sishaath@gmail.com",
              "subject": "Vocto Expense — Deployed to production",
              "html": "<p><strong>A new version has been deployed to production.</strong></p><br><p><strong>Commit:</strong> ${{ github.sha }}</p><p><strong>Author:</strong> ${{ github.actor }}</p><p><strong>Message:</strong> ${{ github.event.head_commit.message }}</p><p><strong>Changes:</strong> ${{ steps.changes.outputs.files }}</p><br><p><a href=\"https://portal.voctotechnologies.com\">View Live Site</a> &nbsp;|&nbsp; <a href=\"https://vercel.com/dashboard\">Vercel Dashboard</a></p>"
            }'
