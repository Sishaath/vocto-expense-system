<div class="bell-wrap">
  <button class="bell-btn" (click)="toggle()" [class.has-unread]="unreadCount > 0">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
  </button>

  <div class="notif-dropdown" *ngIf="open">
    <div class="nd-header">
      <span class="nd-title">Notifications</span>
      <button class="nd-mark-all" *ngIf="unreadCount > 0" (click)="markAllRead()">Mark all read</button>
    </div>

    <div class="nd-list">
      <div class="nd-empty" *ngIf="notifications.length === 0">No notifications</div>
      <div class="nd-item" *ngFor="let n of notifications"
           [class.unread]="!n.read" (click)="clickNotif(n)">
        <div class="nd-dot" *ngIf="!n.read"></div>
        <div class="nd-content">
          <div class="nd-notif-title">{{ n.title }}</div>
          <div class="nd-body" *ngIf="n.body">{{ n.body }}</div>
          <div class="nd-time">{{ timeAgo(n.created_at) }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="nd-overlay" *ngIf="open" (click)="close()"></div>
</div>
