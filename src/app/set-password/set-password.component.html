<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <img src="/vocto-logo.png" alt="Vocto" class="login-logo-img" />
      <div class="login-company">Vocto Technologies Private Limited</div>
    </div>
    <div class="login-sub">EXPENSE & APPROVAL SYSTEM</div>
    <div class="orange-bar"></div>

    <ng-container *ngIf="done">
      <h2>All set!</h2>
      <p class="sub">Your password has been saved. Redirecting you now...</p>
    </ng-container>

    <ng-container *ngIf="!done && sessionReady">
      <h2>Set your password</h2>
      <p class="sub">Tell us your name and choose a password</p>

      <div class="field">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="fullName" placeholder="e.g. Aruljothi S" (keyup.enter)="setPassword()" />
      </div>
      <div class="field">
        <label>New Password</label>
        <input type="password" [(ngModel)]="password" placeholder="Min. 8 characters" (keyup.enter)="setPassword()" />
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="confirm" placeholder="Re-enter password" (keyup.enter)="setPassword()" />
      </div>

      <div class="error" *ngIf="errorMsg">{{ errorMsg }}</div>

      <button class="btn-login" (click)="setPassword()" [disabled]="loading">
        {{ loading ? 'Saving...' : 'Set Password →' }}
      </button>
    </ng-container>

    <ng-container *ngIf="!done && !sessionReady">
      <div class="error" *ngIf="errorMsg">{{ errorMsg }}</div>
      <p class="sub"><a href="/login">Back to login</a></p>
    </ng-container>
  </div>
</div>
